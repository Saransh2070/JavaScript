<!DOCTYPE html>
<html>

<body>
    <h1>JavaScript Variables</h1>
    <h2>Calculator</h2>
    <p id="add"></p>
    <p id="sub"></p>
    <p id="mul"></p>
    <p id="div"></p>
    
    <script>
        var num1 = 10;
        var num2 = 6;
        var sum = num1 + num2;
        var diff = num1 - num2;
        var multiple = num1 * num2;
        var division = num1 / num2;
        document.getElementById("add").innerHTML = "The total sum is: " + sum;
        document.getElementById("sub").innerHTML = "The difference is: " + diff;
        document.getElementById("mul").innerHTML = "The multiple is: " + multiple;
        document.getElementById("div").innerHTML = "The division is: " + division;
    </script>
  </body>
  </html>
