<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Simple Calculator</title>
</head>

<body>
    <h1>Simple Calculator</h1>
<p>Perform all operations using JavaScript</p>
<p id="add"></p>
<p id="sub"></p>
<p id="mul"></p>
<p id="div"></p>

<script>
      function add() {

            var a = 5;

            var b = 10;

            var sum = a + b;

            document.getElementById("add").innerHTML = "Sum: " + sum;

        }

        function sub() {

            var a = 10;

            var b = 5;

            var difference = a - b;

            document.getElementById("sub").innerHTML = "Difference: " + difference;

        }

        function mul() {

            var a = 5;

            var b = 10;

            var product = a * b;

            document.getElementById("mul").innerHTML = "Product: " + product;

        }

        function div() {

            var a = 10;

            var b = 5;

            var quotient = a / b;

            document.getElementById("div").innerHTML = "Quotient: " + quotient;

        }

</script>

</body>

</html>
